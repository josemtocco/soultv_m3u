name: Atualizar Soul TV M3U

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions usa UTC. Estes 4 horários produzem uma atualização
    # aproximadamente a cada 6 horas.
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar M3U e testar streams
        run: python gerar_m3u.py

      - name: Gravar arquivos gerados no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add soultv.m3u canais_soultv.json status_soultv.json soultv_api.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos arquivos gerados."
          else
            git commit -m "Atualizar lista Soul TV"
            git push
          fi
